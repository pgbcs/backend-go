services:
  db:
    image: postgres:16-alpine
    container_name: charity-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: charity_user
      POSTGRES_PASSWORD: charity_pass
      POSTGRES_DB: charity_chain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charity_user -d charity_chain"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: charity-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.env.docker:/app/.env:ro
    ports:
      - "8073:8073"

volumes:
  postgres_data:
